<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Local Brand Matchmaker</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://mapbox.com" rel="stylesheet">
</head>
<body>

    <header>
        <h1>Local Brand Matchmaker</h1>
    </header>

    <main class="dashboard-container">

        <section class="sidebar-panel">

            <div id="campaign-form-container">
                <h2>Create Collaboration</h2>
            </div>

            <div id="tracker-container">
                <h2>Active Match Tracker</h2>
            </div>

        </section>

        <section id="map-panel" aria-label="Local brand and creator map">
            <div id="map" role="img" aria-label="Map showing brand and creator locations"></div>
        </section>
    </main>

    <script type="module" src="src/app.js"></script>
    
</body>
</html>
